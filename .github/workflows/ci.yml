name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python-version }}, torch ${{ matrix.torch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
        torch:
          - latest
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            torch: minimum
          - os: macos-latest
            python-version: "3.10"
            torch: minimum
          - os: windows-latest
            python-version: "3.10"
            torch: minimum
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The floor is read from pyproject.toml so it has a single source of
      # truth. PyTorch < 2.3 is built against NumPy 1.x, hence `numpy<2`.
      - name: Pin the minimum supported PyTorch
        if: matrix.torch == 'minimum'
        shell: bash
        run: |
          floor=$(sed -n 's/^ *"torch>=\([0-9.]*\)".*/\1/p' pyproject.toml)
          test -n "$floor"
          printf 'torch==%s.*\nnumpy<2\n' "$floor" > "$RUNNER_TEMP/minimum.txt"
          echo "PIP_CONSTRAINT=$RUNNER_TEMP/minimum.txt" >> "$GITHUB_ENV"
      - run: python -m pip install -U pip
      - run: python -m pip install torch --index-url ${{ env.TORCH_INDEX_URL }}
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import numpy, torch; print('torch', torch.__version__, 'numpy', numpy.__version__)"
      - run: pytest --cov

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip build
      - run: python -m build
      - run: python -m tools.smoke --torch-index-url ${{ env.TORCH_INDEX_URL }}

  quality:
    name: quality, package, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install torch --index-url ${{ env.TORCH_INDEX_URL }}
      - run: python -m pip install -e ".[dev,docs]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy optora
      - run: python -m build
      - run: twine check dist/*
      - run: python -m tools.docs check
      - run: python -m tools.docs build

  # Times tests/benchmarks/ on this commit and, on a pull request, on its base
  # commit in the same job, failing when the minimum time of a benchmark both
  # commits define regresses by more than BENCHMARK_MAX_REGRESSION. The
  # threshold sits above shared-runner noise, so it catches gross regressions;
  # the exact host-sync budgets are enforced by every job of the test matrix.
  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    env:
      BENCHMARK_MAX_REGRESSION: 50%
      # Inside the checkout: pytest-benchmark crashes while reporting a
      # machine_info change for storage outside the working directory
      # (ionelmc/pytest-benchmark#217).
      BENCHMARK_STORAGE: ${{ github.workspace }}/.benchmarks
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install torch --index-url ${{ env.TORCH_INDEX_URL }}
      # This commit's toolchain is installed first, so the base keeps every
      # tool it already accepts and both commits are timed with the same one.
      - run: python -m pip install -e ".[dev]"
      # The base runs its own suite, so a base without one is skipped.
      - name: Benchmark the base commit
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          if [ -d tests/benchmarks ]; then
            python -m pip install -e ".[dev]"
            python -m pytest tests/benchmarks --benchmark-enable --benchmark-only \
              --benchmark-storage="file://$BENCHMARK_STORAGE" --benchmark-save=base
          fi
      # Points the editable install back at this commit after the base run.
      - run: python -m pip install -e ".[dev]"
      - name: Benchmark this commit against the base
        shell: bash
        run: |
          compare=()
          if compgen -G "$BENCHMARK_STORAGE/*/*_base.json" > /dev/null; then
            compare=(--benchmark-compare "--benchmark-compare-fail=min:$BENCHMARK_MAX_REGRESSION")
          fi
          python -m pytest tests/benchmarks --benchmark-enable --benchmark-only \
            --benchmark-storage="file://$BENCHMARK_STORAGE" "${compare[@]}"

  # Single required status check for branch protection, so the matrix above
  # can change without editing the protection rules.
  gate:
    name: ci gate
    if: always()
    needs:
      - tests
      - smoke
      - quality
      - benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
