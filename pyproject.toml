[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optora"
version = "0.1.0"
description = "A research-oriented optimization library for deterministic and stochastic methods."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Optora contributors" }
]
keywords = [
  "optimization",
  "stochastic optimization",
  "deterministic optimization",
  "machine learning",
  "scientific computing"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "torch>=2.2"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.5",
  "mypy>=1.10",
  "twine>=5",
  # Test-only: exact linear-program references for the ambiguity sets in
  # tests/dro/oracles.py. Never a runtime dependency of optora.
  "scipy>=1.11",
  # Test-only: property-based tests of the ambiguity-set invariants in
  # tests/dro/test_properties.py. Never a runtime dependency of optora.
  "hypothesis>=6.100",
  # Test-only: the performance guard in tests/benchmarks/. Never a runtime
  # dependency of optora.
  "pytest-benchmark>=5.1"
]
docs = [
  "zensical>=0.0.11",
  "mkdocstrings-python>=1.10"
]
# Only for running scripts under examples/ (never a runtime dependency of
# optora itself, and never shipped in the sdist/wheel — see MANIFEST.in).
examples = [
  "matplotlib>=3.8"
]

# Zero-bloat distribution: only the `optora` package ships in the wheel.
# `examples/`, `docs/`, `progress/`, `site/`, `tests/`, and `tools/` are
# excluded from both the wheel (via `packages.find` below) and the sdist
# (via MANIFEST.in). `include-package-data = false` and
# `exclude-package-data` are defense-in-depth against any non-Python file
# (images, notebooks, data logs) ever being picked up from inside `optora/`.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["optora*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.png", "*.jpg", "*.jpeg", "*.gif", "*.svg", "*.mp4", "*.csv", "*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmarks run once as plain tests by default, so their host-sync budgets
# are checked everywhere; `--benchmark-enable` times them (see CONTRIBUTING.md).
addopts = "-q --benchmark-disable"
pythonpath = ["."]

# Coverage gate enforced in CI by `pytest --cov`; `fail_under` is its single
# source of truth.
[tool.coverage.run]
source = ["optora"]
branch = true

[tool.coverage.report]
fail_under = 98
show_missing = true
skip_covered = true
exclude_also = ["raise NotImplementedError"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
# These pages embed the example scripts through `--8<--` snippet includes
# inside ```py fences; formatting them as Python would break the includes.
exclude = ["docs/examples/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["optora"]
ignore_missing_imports = true
strict = true
